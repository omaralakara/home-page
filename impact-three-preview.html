<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synergi Impact Three.js Preview</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="assets/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/impact-section.css">
  <link rel="stylesheet" href="css/impact-three-section.css">
  <script type="module" src="js/impact-three-section.js"></script>
</head>
<body>
  <main>
    <section
      id="synergi-impact"
      class="synergi-impact-section synergi-impact-section--three"
      aria-labelledby="synergi-impact-title"
      data-synergi-impact-three
      data-active-state="clients"
      data-transition-phase="idle"
    >
      <div class="synergi-impact-container">
        <header class="synergi-impact-heading">
          <p class="synergi-impact-eyebrow">Synergi at a glance</p>
          <h2 id="synergi-impact-title">Built to deliver at scale</h2>
        </header>

        <ul
          class="synergi-impact-stats"
          role="list"
          aria-label="Synergi company statistics"
          data-synergi-impact-stats
        >
          <li class="synergi-impact-stat-item">
            <button class="synergi-impact-stat is-active" type="button" data-synergi-impact-state="clients" aria-pressed="true">
              <span class="synergi-impact-stat-value">50+</span>
              <span class="synergi-impact-stat-description">Clients <span>we have served</span></span>
            </button>
          </li>
          <li class="synergi-impact-stat-item">
            <button class="synergi-impact-stat" type="button" data-synergi-impact-state="locations" aria-pressed="false">
              <span class="synergi-impact-stat-value">5</span>
              <span class="synergi-impact-stat-description">Global delivery <span>locations</span></span>
            </button>
          </li>
          <li class="synergi-impact-stat-item">
            <button class="synergi-impact-stat" type="button" data-synergi-impact-state="experience" aria-pressed="false">
              <span class="synergi-impact-stat-value">100+</span>
              <span class="synergi-impact-stat-description">Years of combined <span>experience</span></span>
            </button>
          </li>
          <li class="synergi-impact-stat-item">
            <button class="synergi-impact-stat" type="button" data-synergi-impact-state="savings" aria-pressed="false">
              <span class="synergi-impact-stat-value">10-15%</span>
              <span class="synergi-impact-stat-description">Direct <span>savings</span></span>
            </button>
          </li>
        </ul>

        <div class="synergi-impact-visual" data-synergi-impact-visual>
          <canvas
            class="synergi-impact-canvas synergi-impact-three-canvas"
            data-synergi-impact-three-canvas
            aria-hidden="true"
          ></canvas>
          <div class="synergi-impact-three-fallback" aria-hidden="true">
            Synergi delivery network
          </div>
          <div class="synergi-impact-visual-label" aria-hidden="true">
            <span>One connected delivery network</span>
            <span data-synergi-impact-visual-state>50+ connected relationships</span>
          </div>
        </div>

        <p
          class="synergi-impact-status"
          data-synergi-impact-status
          aria-live="polite"
          aria-atomic="true"
        ></p>
      </div>
    </section>
  </main>
</body>
</html>
